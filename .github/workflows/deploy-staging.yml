name: Deploy (staging)

# Deploys the server to its staging app on Fly.io (fly.toml). Runs after the
# CI workflow passes on a push to main, or by hand from the Actions tab. The
# `staging` environment holds the deploy token (secret FLY_API_TOKEN) and the
# deployment's own values (variables FLY_APP and SERVER_URL), which replace
# the placeholders in fly.toml. Production deploys from deploy.yml, when a
# release is published. See docs/deployment-fly.io.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      wipe_data:
        description: >-
          Wipe the staging data volume before deploying. The server then starts
          over an empty data directory.
        type: boolean
        default: false

concurrency:
  group: fly-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run event also fires for failed runs and for pull request
    # runs, so deploy only a passing push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      FLY_APP: ${{ vars.FLY_APP }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - name: Fail on purpose to test the failure notifier
        run: exit 1
      - name: Check deployment variables
        run: |
          if [ -z "$FLY_APP" ] || [ -z "$SERVER_URL" ]; then
            echo "::error::Set the FLY_APP and SERVER_URL variables on the staging environment."
            exit 1
          fi

      # Deploy the commit CI tested, not whatever main points at by now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Clears the volume on the running machine, keeping the ext4 lost+found
      # directory. The command runs through the Machines API exec call, the
      # same API the deploy below updates the machine through, so the deploy
      # token reaches it. The deploy then replaces the process, which stamps
      # the empty data directory at the current layout version. Staging only:
      # the production workflow has no such option.
      - name: Wipe data volume
        if: github.event_name == 'workflow_dispatch' && inputs.wipe_data
        run: |
          machine="$(flyctl machine list --app "$FLY_APP" --json | jq -r '.[0].id')"
          if [ -z "$machine" ] || [ "$machine" = null ]; then
            echo "::error::No machine found for $FLY_APP."
            exit 1
          fi
          flyctl machine exec --app "$FLY_APP" "$machine" \
            "find /data -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      - name: Deploy
        run: >-
          flyctl deploy --remote-only --app "$FLY_APP" --env
          "SERVER_URL=$SERVER_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
