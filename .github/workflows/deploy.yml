name: Deploy

# Deploys the server to Fly.io (fly.toml). Runs when a GitHub release is
# published, or by hand from the Actions tab. The `production` environment
# holds the deploy token (secret FLY_API_TOKEN) and the deployment's own
# values (variables FLY_APP and SERVER_URL), which replace the placeholders in
# fly.toml. Pull requests from forks cannot reach that environment. See
# docs/deployment-fly.io.md.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      FLY_APP: ${{ vars.FLY_APP }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - name: Fail on purpose to test the failure notifier
        run: exit 1
      - name: Check deployment variables
        run: |
          if [ -z "$FLY_APP" ] || [ -z "$SERVER_URL" ]; then
            echo "::error::Set the FLY_APP and SERVER_URL variables on the production environment."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      - name: Deploy
        run: >-
          flyctl deploy --remote-only
          --app "$FLY_APP"
          --env "SERVER_URL=$SERVER_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
