services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: was
      POSTGRES_PASSWORD: was
      POSTGRES_DB: was
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U was -d was']
      interval: 2s
      timeout: 5s
      retries: 10
